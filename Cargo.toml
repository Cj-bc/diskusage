[package]
name = "diskusage"
version = "0.1.0"
edition = "2021"
authors = ["Cj-bc <cj.bc-sd@outlook.jp>"]
description = "A cross-platform GUI application for visualizing directory space usage"
repository = "https://github.com/Cj-bc/diskusage"
license = "MIT"
keywords = ["gui", "filesystem", "visualization", "disk-usage"]
categories = ["filesystem", "gui", "visualization"]
readme = "README.md"

[dependencies]
# GUI Framework
egui = "0.24"
eframe = { version = "0.24", features = ["persistence"] }

# File dialogs
rfd = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# File system utilities
dirs = "5.0"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

[target.'cfg(windows)'.dependencies]
# Not used directly: eframe 0.24 imports `winapi::um::winuser` without
# enabling that feature itself, so it only builds when we turn it on.
winapi = { version = "0.3", features = ["winuser"] }

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
pkg-config = "0.3"

# Profile configurations
[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.bench]
inherits = "release"
debug = true

# Benchmarks will be added later
# [[bench]]
# name = "directory_scan"
# harness = false

[features]
default = []
profiling = []
debug-ui = []
bundle = []
embed_resources = []